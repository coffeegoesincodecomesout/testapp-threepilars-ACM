---
# Namespace for test resources
apiVersion: v1
kind: Namespace
metadata:
  name: alertmanager-fanout-test
---
# Tiny Python webhook receiver — logs each incoming POST with a timestamp
# so we can count how many times alertmanager fires for a single alert
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-server
  namespace: alertmanager-fanout-test
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json, datetime, sys

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(length)
            try:
                data = json.loads(body)
                alerts = data.get('alerts', [])
                names = [a['labels'].get('alertname', '?') for a in alerts]
                print(f"[{datetime.datetime.now().isoformat()}] POST /webhook — {len(alerts)} alert(s): {names}", flush=True)
                for a in alerts:
                    print(f"  labels: {a.get('labels')}", flush=True)
            except Exception as e:
                print(f"[{datetime.datetime.now().isoformat()}] POST /webhook — parse error: {e}", flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass  # suppress default access log noise

    print("Webhook receiver listening on :8080", flush=True)
    HTTPServer(('', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: alertmanager-fanout-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
      - name: receiver
        image: registry.access.redhat.com/ubi9/python-39:latest
        command: ["python3", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: webhook-server
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: alertmanager-fanout-test
spec:
  selector:
    app: webhook-receiver
  ports:
  - port: 8080
    targetPort: 8080
---
# NetworkPolicy: allow alertmanager pods in observability namespace to reach the webhook
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager
  namespace: alertmanager-fanout-test
spec:
  podSelector:
    matchLabels:
      app: webhook-receiver
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: open-cluster-management-observability
    ports:
    - port: 8080
